spring:
  application:
    name: medical-semantic-search

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/medical_search}
    username: ${MYSQL_USERNAME:medical_user}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}

# Milvus 配置
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection:
    name: medical_documents
    dimension: 768  # BGE-M3 embedding 维度
    index-type: HNSW
    metric-type: IP  # Inner Product (余弦相似度)

# Embedding 配置
embedding:
  provider: ${EMBEDDING_PROVIDER:local}  # local 或 cloud
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  api:
    url: ${EMBEDDING_API_URL:https://api.minimax.chat/v1/embeddings}
    key: ${EMBEDDING_API_KEY:}
  batch-size: 32
  cache:
    enabled: true
    ttl: 3600  # 1小时

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# OpenAPI 文档
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置
logging:
  level:
    com.medical.semantic: DEBUG
    io.milvus: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# 本地开发配置
spring:
  config:
    activate:
      on-profile: local

embedding:
  provider: local
  model: BAAI/bge-m3
  local:
    model-path: models/bge-m3

---
# 云端配置
spring:
  config:
    activate:
      on-profile: cloud

embedding:
  provider: cloud
  model: embo-01
